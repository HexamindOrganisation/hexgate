name: Build and scan
description: >
  Build one platform image for linux/amd64 and linux/arm64, and fail on any
  HIGH/CRITICAL finding that has a fix. Used by docker-publish.yml, before a
  push or as its dry run.

inputs:
  context:
    description: Build context.
    required: true
  dockerfile:
    description: Dockerfile path.
    required: true
  ignorefile:
    description: >
      Trivy ignore file. Read from the workflow's own commit, never from the
      source being built, so a finding can be accepted for an existing tag.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Emulation for the arm64 half of the build. Only the final stages need
    # it: the dashboard bundle and the Go compile run on the build platform
    # (see the Dockerfiles).
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: arm64

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # One single-platform archive per architecture: given a multi-arch image,
    # Trivy scans only its first platform and ignores --platform.
    # No cache-from/cache-to: a cache shared with PR builds could be poisoned
    # by a PR. A push build later in the same job reuses these builds' layers
    # from the job's own builder.
    - name: Build amd64 for the scan
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        outputs: type=docker,dest=${{ runner.temp }}/image-amd64.tar

    - name: Build arm64 for the scan
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/arm64
        outputs: type=docker,dest=${{ runner.temp }}/image-arm64.tar

    # Trivy from its image pinned by digest, not trivy-action, whose tags were
    # hijacked in 2026. It reads the saved tar: no Docker socket is mounted
    # into it. Fails on HIGH/CRITICAL findings that have a fix; accept one
    # deliberately by listing it in .trivyignore.yaml with a reason, a path
    # scope and an expiry.
    - name: Scan
      shell: bash
      env:
        IGNOREFILE: ${{ inputs.ignorefile }}
      run: |
        mounts=()
        flags=()
        if [ -n "$IGNOREFILE" ] && [ -f "$IGNOREFILE" ]; then
          # Same file name inside: Trivy reads the format from the extension.
          name=$(basename "$IGNOREFILE")
          mounts+=(-v "$(realpath "$IGNOREFILE"):/ignore/$name:ro")
          flags+=(--ignorefile "/ignore/$name")
        fi
        # One vuln DB download per job, shared by both archs: the DB registry
        # rate-limits (TOOMANYREQUESTS), and a failure here after release.yml
        # has published to PyPI leaves the release half done.
        cache="$RUNNER_TEMP/trivy-cache"
        mkdir -p "$cache"
        for arch in amd64 arm64; do
          echo "::group::linux/$arch"
          docker run --rm "${mounts[@]}" \
            -v "$cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP/image-$arch.tar:/image.tar:ro" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${flags[@]}"
          echo "::endgroup::"
          flags+=(--skip-db-update)
        done
