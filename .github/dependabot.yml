# Keeps the digest-pinned base images and SHA-pinned actions current: a pin
# nobody bumps stops receiving security fixes. Each bump is a PR, so it runs
# the full test matrix before it can reach a published image.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /platform/api
      - /platform/mcp
      - /platform/collector
      - /evals/policy_writing
    schedule:
      interval: weekly
    # Digest and patch bumps only. A minor or major tag bump changes the
    # runtime (python 3.14 has no interpreter under platform/api's
    # requires-python), fails the build, and would hold back the security
    # bumps grouped with it. Runtime upgrades are made by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    # The composite actions too: their pins must move with the workflows'.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
