# Keeps the digest-pinned base images and SHA-pinned actions current: a pin
# nobody bumps stops receiving security fixes. Each bump is a PR, so it runs
# the full test matrix before it can reach a published image.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /platform/api
      - /platform/mcp
      - /platform/collector
      - /evals/policy_writing
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
