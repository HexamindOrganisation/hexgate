name: docker-publish-test

# TEMPORARY: delete before merging #473. Runs docker-publish.yml as a dry run
# (build both architectures and scan, no credentials, no push) on the PR,
# since workflow_dispatch only works once the workflow is on main.

on: pull_request

permissions:
  contents: read

jobs:
  dry-run:
    uses: ./.github/workflows/docker-publish.yml
    with:
      dry-run: true
