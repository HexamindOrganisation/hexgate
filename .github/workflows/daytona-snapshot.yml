name: daytona-snapshot

# Rebuild the Daytona demo snapshot so it tracks the code — on a real release,
# and on demand.
#
# The snapshot image `git clone`s the repo INSIDE Daytona's builder (see
# deploy/daytona_snapshot.py), so the build runs on Daytona's side; this runner
# only needs the `daytona` SDK to kick it off. `--force` replaces the existing
# snapshot.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   DAYTONA_API_KEY   — from the Daytona dashboard.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daytona-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Rebuild the demo snapshot on Daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          # Bake the released code on a release; the dispatched branch otherwise.
          # (Both are refs `git clone --branch` accepts — never a bare SHA.)
          HEXGATE_SNAPSHOT_REF: ${{ github.event.release.tag_name || github.ref_name }}
        run: uv run --python 3.13 --with daytona python deploy/daytona_snapshot.py --force
