name: release

# Manual trigger only — click "Run workflow" in the Actions tab.
# Pick a version-type (or explicit version), the workflow scans the platform
# images (a real release only), runs the full test matrix as a gate, bumps
# the SDK version, builds sdist + wheel, publishes to PyPI via trusted
# publishing (OIDC — no token), commits the bump, tags it, opens a GitHub
# release with auto-generated notes, then publishes the platform images
# (docker-publish.yml).
#
# ----------------------------------------------------------------------
# PyPI trusted-publisher registration — REQUIRED before the first run:
#
#   https://pypi.org/manage/account/publishing/  →  "Add a new pending publisher"
#     PyPI Project Name:  hexgate
#     Owner:              HexamindOrganisation
#     Repository name:    hexgate
#     Workflow name:      release.yml
#     Environment name:   pypi-release
#
# Repeat on https://test.pypi.org/manage/account/publishing/ for the
# TestPyPI dry-run path.
#
# Also create a GitHub Environment named `pypi-release`:
#   Settings → Environments → New environment → "pypi-release"
#     - Required reviewers: at least one maintainer
#     - Deployment branches: main only
# ----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: "Bump kind (ignored when 'version' is set)."
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version like 1.2.3. Overrides version-type."
        type: string
        required: false
        default: ""
      dry-run:
        description: "Run everything except publish, commit, and tag."
        type: boolean
        required: false
        default: false
      target:
        description: "Where to publish. Use 'testpypi' for a dry run on the test index."
        type: choice
        required: true
        default: pypi
        options:
          - pypi
          - testpypi

# `id-token: write` lets the runner mint an OIDC token for trusted
# publishing — PyPI verifies that token against the registered publisher
# (this repo + workflow filename + environment) and no PYPI_API_TOKEN is
# needed.
# `contents: write` is needed for the version-bump commit + tag push.
permissions:
  contents: write
  id-token: write

# Only one release at a time — protects against the version-bump race
# where two concurrent runs both bump from N to N+1.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Build and scan the platform images (dry run: no credentials, no push)
  # before the release job publishes anything irreversible. Only for a real
  # release, the one that goes on to publish images; dry runs and TestPyPI
  # runs skip it.
  image-scan:
    if: ${{ !inputs.dry-run && inputs.target == 'pypi' }}
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      dry-run: true

  release:
    needs: image-scan
    # Runs after a passing scan, or when the scan was skipped (dry run,
    # TestPyPI); never after a failed or cancelled one.
    if: ${{ !cancelled() && (needs.image-scan.result == 'success' || needs.image-scan.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Ties this job to the GitHub Environment defined in the repo
    # settings — that's what enforces the required-reviewer prompt and
    # the main-only branch restriction. Also what PyPI's trusted-publisher
    # entry pins against (we registered with Environment = pypi-release).
    environment: pypi-release
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the GitHub release-notes generator can
          # `git log` since the previous tag.
          fetch-depth: 0
          # Default token — used for the version-bump commit + tag push.
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------
      # 1. Toolchain (matches tests.yml exactly so a green release =
      #    a green tests run for that same SHA).
      # --------------------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install OPA
        run: |
          # Per-attempt stall guards + retries against GitHub releases — see
          # tests.yml for why --max-time (not just --retry-max-time) matters.
          curl -fsSL \
            --connect-timeout 15 --max-time 120 \
            --speed-limit 1024 --speed-time 20 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -o opa \
            https://github.com/open-policy-agent/opa/releases/download/v1.21.4/opa_linux_amd64_static
          # Same pin as platform/api/Dockerfile: a tampered download fails here.
          echo "2ab571f367f293bb19523b76f92f1945bbf245003392c7f392903f95c2b9b630  opa" | sha256sum -c -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # The exact version package.json's packageManager pins.
          package_json_file: platform/dashboard/package.json

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/dashboard/pnpm-lock.yaml

      # Same set as tests.yml and platform/api/Dockerfile. The runner image
      # ships Pango but not HarfBuzz-Subset, so without this WeasyPrint falls
      # back to fontTools, which stamps the wall clock into every embedded
      # font's `head.modified` — and the byte-identical render test fails
      # whenever its two renders straddle a second.
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libharfbuzz-subset0 libfribidi0 \
            fonts-liberation2 fonts-dejavu-core

      # --------------------------------------------------------------
      # 2. Gate: re-run the full test matrix inline. We're not just
      #    publishing what tests.yml said was green at PR time — main
      #    may have moved since. Self-contained run, ~2-3 minutes, vs
      #    the alternative ("trust the operator") which has bitten
      #    every other release pipeline I've seen.
      # --------------------------------------------------------------

      - name: SDK — lint + format + tests
        run: |
          uv sync --extra dev
          make check

      - name: Platform API — tests
        run: |
          cd platform/api && uv sync --group dev
          cd ../.. && make platform-api-test

      - name: Dashboard — lint + typecheck + tests
        working-directory: platform/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm format:check
          pnpm test

      # --------------------------------------------------------------
      # 3. Bump the SDK version. Only the root `pyproject.toml`
      #    (the published `hexgate` package) — platform/api/ is not
      #    published from this workflow.
      # --------------------------------------------------------------

      - name: Bump version
        id: bump
        # Inputs reach the shell as env vars, never spliced into the script:
        # a free-text `version` could otherwise inject commands into a job
        # holding a write token.
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          VERSION_TYPE: ${{ inputs.version-type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$TARGET" = "testpypi" ]; then
            # TestPyPI runs use an ephemeral dev version tied to the
            # workflow run number. Each dry-run gets its own slot
            # (`0.0.0.dev<run>`) so iterating against TestPyPI never
            # collides on re-upload, and the version is obviously
            # non-canonical so it can't be mistaken for a real release.
            # We deliberately ignore inputs.version / inputs.version-type
            # here — the user's choice is what they intend to ship to
            # *real* PyPI, and that decision shouldn't be consumed by a
            # dry run. The pyproject.toml change is never committed back
            # to main on this path (see step 6).
            uv version "0.0.0.dev$RUN_NUMBER"
          elif [ -n "$VERSION" ]; then
            # Explicit version (e.g. "1.2.3") overrides version-type.
            uv version "$VERSION"
          else
            uv version --bump "$VERSION_TYPE"
          fi
          # Re-read what uv wrote, so the rest of the workflow has the
          # canonical value (handles dev / rc / etc. suffixes correctly).
          NEXT=$(uv version --short)
          # A real release also tags images as v$NEXT, and docker-publish.yml
          # accepts only this shape. Refuse anything else HERE, before PyPI,
          # the tag and the GitHub release, not after them.
          if [ "$TARGET" = "pypi" ] && ! [[ "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::$NEXT is not X.Y.Z or X.Y.Z{a,b,rc}N, the versions the platform images can be tagged with"
            exit 1
          fi
          # platform/api pins the SDK by path; keep its lock's hexgate entry
          # in step with the bump (it is committed with the root lock below).
          (cd platform/api && uv lock)
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Resolved next version: $NEXT"

      # --------------------------------------------------------------
      # 4. Build sdist + wheel. `uv build` writes to `dist/`.
      # --------------------------------------------------------------

      - name: Build sdist + wheel
        run: |
          uv build
          ls -la dist/

      # --------------------------------------------------------------
      # 5. Publish via OIDC trusted publishing. No token needed —
      #    pypa/gh-action-pypi-publish reads the OIDC token from the
      #    env vars GitHub Actions auto-sets when `id-token: write`
      #    is granted and exchanges it for a short-lived PyPI upload
      #    token. PyPI verifies against the registered publisher.
      # --------------------------------------------------------------

      # ``skip-existing: true`` makes the publish idempotent — if PyPI
      # already has this version (e.g. a previous run's "publish
      # succeeded, commit-back failed" partial state), the action
      # logs a skip and exits cleanly instead of erroring with a 400.
      # Lets a re-run finish the workflow's later steps (commit + tag
      # + GitHub release) without manual surgery to bypass the
      # already-published file.
      - name: Publish to PyPI
        if: ${{ !inputs.dry-run && inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

      - name: Publish to TestPyPI
        if: ${{ !inputs.dry-run && inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Dry-run summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "Dry run — skipping publish, commit, tag, release."
          echo "Would have published hexgate@${{ steps.bump.outputs.version }} to ${{ inputs.target }}"

      # --------------------------------------------------------------
      # 6. Persist the version bump. Only on a real run — dry-runs and
      #    TestPyPI runs don't dirty `main`.
      #
      #    Skipping for testpypi is deliberate: TestPyPI is for
      #    iteration ("does the workflow even work?") and shouldn't
      #    leak version-bump commits onto main. Real release-to-prod
      #    is the only path that touches git state.
      # --------------------------------------------------------------

      - name: Commit + tag (PyPI only)
        if: ${{ !inputs.dry-run && inputs.target == 'pypi' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock platform/api/uv.lock
          git commit -m "release: v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: GitHub release
        if: ${{ !inputs.dry-run && inputs.target == 'pypi' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "v${{ steps.bump.outputs.version }}"
          # Auto-generate notes from commits since the previous tag.
          generate_release_notes: true

  # The platform images for the same tag. Called, not triggered by the
  # release: a release made with GITHUB_TOKEN starts no other workflow. Its
  # own `docker-release` environment asks for a second approval.
  images:
    needs: release
    if: ${{ !inputs.dry-run && inputs.target == 'pypi' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: v${{ needs.release.outputs.version }}
