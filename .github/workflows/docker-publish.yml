name: docker-publish

# Publish the platform images (api, mcp, collector) to GHCR and Docker Hub for
# a release tag: one build, so both registries serve the same digest.
# Called by release.yml once a real release is tagged, or dispatched by hand
# from main with an existing tag to (re)publish it. Not on `release:
# published`: release.yml creates the release with GITHUB_TOKEN, and events
# made with that token never start other workflows.
#
# Per image: build from the tag's checkout, scan, and only if the scan is
# clean push with SBOM + provenance attestations, then sign the pushed digest
# with cosign (keyless, through the job's OIDC identity). Pull by digest and
# verify with `cosign verify` (platform/DEPLOY.md, "Published images").
#
# ----------------------------------------------------------------------
# REQUIRED before the first run: a GitHub Environment named `docker-release`
#   Settings → Environments → New environment → "docker-release"
#     - Required reviewers: at least one maintainer
#     - Deployment branches: main only
#     - Environment secrets (only this gated job can read them):
#         DOCKERHUB_USERNAME  the Docker Hub account that owns the token
#         DOCKERHUB_TOKEN     a Docker Hub access token, Read & Write,
#                             with push rights on the `hexgate` namespace
# GHCR needs no secret: the job's GITHUB_TOKEN pushes there.
# ----------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.3.4."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.3.4."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    environment: docker-release
    # Only this job holds a registry write and an OIDC token, and only behind
    # the environment's reviewers.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hexgate-api
            context: .
            dockerfile: platform/api/Dockerfile
          - image: hexgate-mcp
            context: .
            dockerfile: platform/mcp/Dockerfile
          - image: hexgate-collector
            context: platform/collector
            dockerfile: platform/collector/Dockerfile

    steps:
      # The tag reaches the shell as an env var and must look like a release
      # tag before anything uses it. GHCR wants lowercase owner names.
      - name: Resolve the tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ matrix.image }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
            echo "hub=docker.io/hexgate/$IMAGE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - name: Commit of the tag
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Emulation for the arm64 half of the build. Only the final stages need
      # it: the dashboard bundle and the Go compile run on the build platform
      # (see the Dockerfiles). One job builds both architectures, so the push
      # needs one approval and yields one multi-arch digest.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # One single-platform archive per architecture: given a multi-arch
      # image, Trivy scans only its first platform and ignores --platform.
      # No cache-from/cache-to: a cache shared with PR builds could be
      # poisoned by a PR. The push build below reuses these builds' layers
      # from the job's own builder.
      - name: Build amd64 for the scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/image-amd64.tar

      - name: Build arm64 for the scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          outputs: type=docker,dest=${{ runner.temp }}/image-arm64.tar

      # Trivy from its image pinned by digest, not trivy-action, whose tags
      # were hijacked in 2026. It reads the saved tar: no Docker socket is
      # mounted into it. Fails on HIGH/CRITICAL findings that have a fix;
      # accept one deliberately by listing it in .trivyignore with a reason.
      - name: Scan
        run: |
          mounts=()
          flags=()
          if [ -f .trivyignore ]; then
            mounts+=(-v "$PWD/.trivyignore:/trivyignore:ro")
            flags+=(--ignorefile /trivyignore)
          fi
          for arch in amd64 arm64; do
            echo "::group::linux/$arch"
            docker run --rm "${mounts[@]}" \
              -v "$RUNNER_TEMP/image-$arch.tar:/image.tar:ro" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --input /image.tar --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "${flags[@]}"
            echo "::endgroup::"
          done

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Immutable tags only: the version and the commit. No `latest`, so a
      # tag never changes meaning; consumers should still pull by digest.
      - name: Push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.rev.outputs.sha }}
            ${{ steps.meta.outputs.hub }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.hub }}:sha-${{ steps.rev.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # Keyless: the signature binds the digest to this workflow's identity,
      # which `cosign verify` checks (DEPLOY.md). Signatures live beside the
      # image in each registry, so sign it in both. The digest is the
      # multi-arch index; --recursive also signs each platform's manifest,
      # so a digest pinned to one architecture verifies too.
      - name: Sign
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          HUB: ${{ steps.meta.outputs.hub }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST" "$HUB@$DIGEST"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          HUB: ${{ steps.meta.outputs.hub }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "Published \`$VERSION\` as digest \`$DIGEST\`:"
            echo "- \`$IMAGE@$DIGEST\`"
            echo "- \`$HUB@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
