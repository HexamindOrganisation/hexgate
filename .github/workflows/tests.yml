name: tests

# Two triggers, by design:
#   - push: main   → re-verify after merge so `main` stays green
#                    even if a PR was merged with bypassed CI.
#   - pull_request → PR gate: every PR targeting main runs the full
#                    matrix before merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit arrives.
# Saves CI minutes on rapid-fire pushes / force-pushes during PR review.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (hexgate package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Cache the project's deps + uv's own download cache, keyed by
          # uv.lock so a lockfile change invalidates cleanly.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      # OPA is required for the WASM-engine tests (tests/security/test_wasm_engine.py).
      # Without it, ~10 tests skip silently via the @needs_opa marker.
      # Pin a known-good version so an upstream OPA change can't break CI overnight.
      - name: Install OPA
        run: |
          # Fetch straight from GitHub releases (skips the openpolicyagent.org
          # redirect hop) with per-ATTEMPT stall guards. --retry-max-time alone
          # only gates whether to START a retry; a single transfer that stalls
          # mid-download (curl 56) hangs indefinitely without --max-time, which
          # is what ate a 5m job. --speed-limit/-time aborts a dead transfer in
          # ~20s so a retry fires fast instead of waiting out the clock.
          curl -fsSL \
            --connect-timeout 15 --max-time 120 \
            --speed-limit 1024 --speed-time 20 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -o opa \
            https://github.com/open-policy-agent/opa/releases/download/v0.70.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Sync deps
        run: uv sync --extra dev

      # Split out from `make check` (lint + fmt-check + test) so we can
      # run pytest with coverage without re-running it. Same gating, one
      # extra step for the xml emit.
      - name: Lint
        run: make lint

      - name: Format check
        run: make fmt-check

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: sdk
          token: ${{ secrets.CODECOV_TOKEN }}
          # Don't fail the build on a Codecov outage — the suite is
          # already green, we don't want a third-party uploader to
          # block merges.
          fail_ci_if_error: false

  platform-api:
    name: Platform API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "platform/api/uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      # platform/api depends on the SDK's compile_to_wasm at runtime
      # (PUT /v1/projects/.../agents triggers bundle compile + sign),
      # which shells out to `opa`. Without it on PATH, the bearer-GET
      # round-trip tests that expect a signed bundle (e.g. the ETag
      # conditional-GET test) end up with an unsigned response and no
      # ETag header. Same pin as the SDK job.
      - name: Install OPA
        run: |
          # Fetch straight from GitHub releases (skips the openpolicyagent.org
          # redirect hop) with per-ATTEMPT stall guards. --retry-max-time alone
          # only gates whether to START a retry; a single transfer that stalls
          # mid-download (curl 56) hangs indefinitely without --max-time, which
          # is what ate a 5m job. --speed-limit/-time aborts a dead transfer in
          # ~20s so a retry fires fast instead of waiting out the clock.
          curl -fsSL \
            --connect-timeout 15 --max-time 120 \
            --speed-limit 1024 --speed-time 20 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -o opa \
            https://github.com/open-policy-agent/opa/releases/download/v0.70.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      # WeasyPrint renders the AI Act evidence report through Pango, and the
      # two font families report.css names are what the pages are laid out in.
      # Without the native stack the suite fails at import; without the fonts
      # it lays out different pages from the ones the image produces. Same set
      # as platform/api/Dockerfile.
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libharfbuzz-subset0 libfribidi0 \
            fonts-liberation2 fonts-dejavu-core

      - name: Sync platform-api deps
        run: cd platform/api && uv sync --group dev

      - name: Lint
        run: cd platform/api && uv run ruff check .

      - name: Tests with coverage
        run: cd platform/api && uv run pytest --cov --cov-report=xml --cov-report=term tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./platform/api/coverage.xml
          flags: platform-api
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  platform-api-postgres:
    # The platform-api job runs the whole suite on SQLite, never exercising
    # asyncpg. This job sets DATABASE_URL and runs the opt-in Postgres tests:
    # the schema-builds smoke test, and the migration tests that EXECUTE
    # platform/{postgres,clickhouse}/migrations rather than pattern-matching
    # them. Nothing else in CI runs a migration file.
    name: Platform API (migration execution)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hexgate
          POSTGRES_USER: hexgate
          POSTGRES_PASSWORD: ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U hexgate -d hexgate"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The migration tests build scratch databases here, so this store gets the
      # same replay/equivalence/idempotency coverage as Postgres. clickhouse/0003
      # is the migration that took both stages down.
      clickhouse:
        image: clickhouse/clickhouse-server:24.10
        env:
          CLICKHOUSE_DB: hexgate_audit
          CLICKHOUSE_USER: hexgate
          CLICKHOUSE_PASSWORD: ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - "8123:8123"
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hexgate:ci@localhost:5432/hexgate
      HEXGATE_CLICKHOUSE_HOST: localhost
      HEXGATE_CLICKHOUSE_PORT: "8123"
      HEXGATE_CLICKHOUSE_USER: hexgate
      HEXGATE_CLICKHOUSE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "platform/api/uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync platform-api deps
        run: cd platform/api && uv sync --group dev

      - name: Postgres smoke + migration execution tests
        run: |
          cd platform/api && uv run pytest \
            tests/core/test_postgres_smoke.py \
            tests/core/test_migrations.py -v

      # The ClickHouse half is marked `integration` (it creates and drops
      # scratch databases), so conftest skips it above. Scoped to this file so
      # the rest of the integration suite -- which wants a seeded schema this
      # job does not build -- stays out.
      - name: ClickHouse migration execution tests
        run: |
          cd platform/api && uv run pytest \
            tests/core/test_migrations.py -m integration -v

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform/dashboard/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # All three steps gate merge — lint and typecheck are cheap and
      # catch the bulk of mechanical PR mistakes before a reviewer
      # has to look at them.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./platform/dashboard/coverage/lcov.info
          flags: dashboard
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
