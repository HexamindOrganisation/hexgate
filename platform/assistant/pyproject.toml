[project]
name = "hexgate-assistant"
version = "0.1.0"
description = "Hexgate policy assistant — chat over the platform's policy tools, in its own container"
requires-python = ">=3.13"
dependencies = [
    # Both imported directly (starlette by the app, uvicorn by __main__), so
    # pinned the same way platform/mcp pins them.
    "starlette>=0.40",
    "uvicorn>=0.32",
    # Fetches the API's JWKS.
    "httpx>=0.27.1",
    # Verifies the API's EdDSA access tokens; [crypto] pulls in cryptography
    # for Ed25519. 2.10.0 compared `iss` by substring (CVE-2024-53861).
    "pyjwt[crypto]>=2.10.1",
    # The assistant's own database: async SQLAlchemy over asyncpg.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    # Tests generate Ed25519 keys directly; transitive via pyjwt[crypto].
    "cryptography>=43",
    # The tables are created on SQLite in tests; deploy runs Postgres.
    "aiosqlite>=0.20",
    # Exactly the ruff the root uv.lock locks: `make lint` and `make fmt-check`
    # run the root's over platform/assistant, `make assistant-check` runs this
    # one, and two versions would one day disagree on the same file.
    "ruff==0.15.12",
]

[tool.ruff.lint]
# Declaring a [tool.ruff] table stops inheritance from the repo root, so
# isort is re-enabled here to match it.
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false
