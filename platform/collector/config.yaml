# Runtime config for the hexgate-collector binary (built via
# `make collector-generate`, or run directly via `make collector-run`).
# Dev-only defaults throughout — not load-tested.
receivers:
  otlp:
    protocols:
      grpc:
        # Loopback suits host-native dev; the deploy container overrides to
        # 0.0.0.0 (a loopback bind is unreachable from outside the container).
        endpoint: ${env:HEXGATE_COLLECTOR_GRPC_ENDPOINT:-127.0.0.1:4317}
        auth:
          authenticator: hexgatebiscuitauth
        # No max_recv_msg_size_mib override, so this stays at grpc-go's 4 MiB
        # — deliberately NOT raised alongside the HTTP receiver below. The SDK
        # is HTTP-only (_senders.py imports the proto.http exporter), and 4317
        # is unpublished; anything that starts using it needs this raised too.
        # Required for message_key_from_metadata_key (see the kafka
        # exporter below) to see project_id at all — client metadata
        # isn't propagated to downstream consumers by default.
        include_metadata: true
      http:
        endpoint: ${env:HEXGATE_COLLECTOR_HTTP_ENDPOINT:-127.0.0.1:4318}
        auth:
          authenticator: hexgatebiscuitauth
        include_metadata: true
        # confighttp defaults this to 20 MiB, and the rejection is on the whole
        # POST before any batching or per-span handling — one oversized export
        # loses every span in it. The SDK exports up to 64 spans at a time
        # (max_export_batch_size in hexgate/tracing/_senders.py) and an LLM
        # message span can reach ~272 KiB uncompressed, so a full export is
        # ~17 MiB, uncomfortably close to that default. 32 MiB is the headroom.
        max_request_body_size: 33554432 # 32 MiB

processors:
  # Values are reasonable dev defaults, not load-tested.
  # Raised with the record-size budget: the receiver now admits 32 MiB bodies
  # and the exporter queue is bounded at 128 MiB (see sending_queue below), so
  # a 384 MiB soft limit would refuse intake under ordinary message traffic.
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256

  # Resource-level (whole batch) provenance tag — a real, common use of
  # this processor, not just a placeholder. Where a real deployment would
  # also stamp deployment.environment, service.instance.id, etc.
  resource:
    attributes:
      - key: collector.name
        value: hexgate-collector
        action: upsert

  # Span-level placeholder — proves the wiring point exists. No real
  # per-span transformation decided yet: the design doc assigns
  # redaction/byte-capping to the enrichment job downstream, not this
  # Collector, so this processor doesn't have a real job yet either.
  attributes:
    actions:
      - key: collector.stage
        value: ingest
        action: upsert

  batch:
    # Spans per exported batch, i.e. per Kafka record — down from 512. LLM
    # message spans (scope hexgate.messages) carry up to ~272 KiB of prompt and
    # completion JSON against a decision span's ~1 KiB, and one record over the
    # topic's max.message.bytes is rejected whole, taking the decision spans
    # batched alongside it. There is only ONE batch processor and ONE topic for
    # every scope, and batching is count-based, so this single number has to be
    # safe for the largest span type: 24 x 272 KiB = 6.375 MiB, inside the 8 MiB
    # topic/producer limit. Decision-only traffic then ships ~20x more records,
    # all small, which Redpanda handles at our volume.
    #
    # Both knobs, because they cover different paths and the processor refuses
    # to start unless send_batch_max_size >= send_batch_size: the flush
    # threshold caps a batch accumulated over the 5 s timer, the max splits a
    # single oversized incoming request that would otherwise pass straight
    # through.
    timeout: 5s
    send_batch_size: 24
    send_batch_max_size: 24
    # Without this, the batch processor rebuilds its export context from
    # scratch and drops all incoming client metadata — the kafka
    # exporter's message_key_from_metadata_key: project_id below would
    # silently never resolve, with no startup error.
    metadata_keys: [project_id]
    # Each distinct project_id gets its own batcher, in a map that NEVER
    # evicts — deleted and revoked projects count forever. Once this many
    # combinations have been seen since process start, spans for new
    # projects are rejected with a permanent, non-retryable error even
    # though their key authenticated. So this is a hard ceiling on lifetime
    # projects per process run, not a tuning knob; the upstream default
    # (1000) is low enough to hit quietly, hence the explicit value.
    # Revisit before real multi-tenant scale.
    metadata_cardinality_limit: 10000

exporters:
  kafka:
    # localhost, not the redpanda:29092 container-network listener — this
    # binary is meant to run natively on the host for local dev, same
    # convention as `make platform-api`. See platform/docker-compose.yml.
    brokers: ["${env:HEXGATE_REDPANDA_BOOTSTRAP_SERVER:-localhost:9092}"]
    traces:
      topic: hexgate.otlp.raw
      encoding: otlp_proto
      # Set by the hexgatebiscuitauth extension below, which resolves it from
      # the API key's database row (not from the token's own self-declared
      # project fact, which is only a mint-time snapshot).
      message_key_from_metadata_key: project_id
    producer:
      # Client-side limit, checked before the record ever reaches Redpanda, so
      # it must match the topic's max.message.bytes (create-topics.sh) — raising
      # only the topic changes nothing. configkafka defaults it to 1 000 000.
      #
      # This one is measured BEFORE compression: it maps to franz-go's
      # ProducerBatchMaxBytes, which is explicit that a batch is sized
      # uncompressed. So the hard ceiling here is 8 MiB of raw spans — 30 at
      # 272 KiB — and send_batch_max_size: 24 is a ~25% margin under it, not
      # 24 plus whatever zstd happens to buy. Only the broker's own
      # max.message.bytes is checked on the compressed batch.
      max_message_bytes: 8388608 # 8 MiB
      # Default is "none". Bought for network and disk, not for headroom
      # against the limit above (see the note there): span batches are highly
      # repetitive JSON and compress well.
      compression: zstd
    sending_queue:
      # Bound the export queue in BYTES, not requests. The default is 1000
      # *requests* with no size notion, which was ~500 MiB of ~1 KiB decision
      # spans but becomes ~6.2 GiB once a queued request can be a 6.375 MiB
      # batch of message spans — an OOM on a box that also hosts ClickHouse,
      # Postgres and Redpanda for two stages. Overflow is non-blocking, so a
      # Redpanda outage now sheds spans at a fixed memory cost instead of
      # growing until the process dies.
      sizer: bytes
      queue_size: 134217728 # 128 MiB
    record_partitioner:
      # Hashes whatever message_key_from_metadata_key resolves to, so
      # the same project_id always lands on the same partition.
      sticky_key:
        hasher: murmur2

extensions:
  hexgatebiscuitauth:
    # The platform's root Ed25519 public key — the public half of the key
    # core/keystore.py signs every API key with. It writes the raw 32 bytes to
    # hexgate.pub (0644) next to the private half, so the default below is the
    # keystore's own default directory relative to this one. Same host-native
    # dev convention as the broker address below.
    #
    # Use `public_key` instead to paste the key inline: that field takes the
    # exact base64 string GET /v1/.well-known/keys publishes as keys[0].x,
    # for a Collector with no shared filesystem with the control plane.
    #
    # The relative default resolves against the process working directory,
    # not this file's directory — `make collector-run` starts the binary from
    # platform/collector/, which is what makes it work. From any other cwd,
    # set the env var to an absolute path. Note `validate` never reads the
    # file, so a wrong path only surfaces as a refusal at Start().
    public_key_file: ${env:HEXGATE_COLLECTOR_PUBLIC_KEY_FILE:-../api/data/hexgate.pub}

    revocation:
      # Revoking an API key deletes its row, so the check is a lookup against
      # a snapshot of the whole key table rather than a flag. The signed
      # token_id fact is that row's own id (platform-api PR #126), which is
      # what lets this be keyed on a short id instead of the full secret.
      #
      # LOCAL DEV ONLY credentials, matching the postgres service in
      # platform/docker-compose.yml — never reuse these anywhere deployed.
      # Enforced, not just asked: config validation refuses this password on
      # any non-local host, same as the Python side's settings.py validator.
      # pgx wants a plain postgres:// URL, not the postgresql+asyncpg:// form
      # the Python side's DATABASE_URL uses.
      dsn: ${env:HEXGATE_COLLECTOR_POSTGRES_DSN:-postgres://hexgate:hexgate-dev-password@localhost:5433/hexgate}
      # Steady-state revocation latency: how long a revoked key still works
      # while refreshes SUCCEED.
      poll_interval: ${env:HEXGATE_COLLECTOR_REVOCATION_POLL_INTERVAL:-20s}
      # How long a snapshot may go un-refreshed before this rejects every
      # request. An hour because 2m sat under routine control-plane maintenance,
      # which the deploy healthcheck reports as green. Keep in lockstep with the
      # extension's defaults.
      max_staleness: ${env:HEXGATE_COLLECTOR_REVOCATION_MAX_STALENESS:-1h}

service:
  extensions: [hexgatebiscuitauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [kafka]
