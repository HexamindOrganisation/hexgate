# Hexgate's routes for app.hexgate.ai (prod). The box's nginx includes this
# file from that hostname's server block, so a change here ships when
# /srv/hexgate-prod moves to a commit that has it, followed by `sudo nginx -t
# && sudo systemctl reload nginx` (platform/DEPLOY.md sections 3 and 6). The
# server block keeps its own listen, TLS, headers and catch-all `location /` to
# the api on 127.0.0.1:7000.
#
# hexgate-staging.conf is this file with the staging ports; `make nginx-check`
# fails if the two drift apart.

# The collector's OTLP/HTTP receiver (HEXGATE_OTLP_PORT), so the SDK's default
# endpoint <api url>/v1/traces works with no client config. The body cap is
# the proxy's own and is checked before the collector verifies the token, so
# it is what an unauthenticated caller can make nginx buffer: 32m covers a
# 64-span batch of maximally sized message spans and nothing more
# (docs/internals/audit-pipeline.md, record-size budget).
location = /v1/traces {
    proxy_pass http://127.0.0.1:7001;
    client_max_body_size 32m;
}
