# Hexgate's routes for app.staging.hexgate.ai (staging). The box's nginx
# includes this file from that hostname's server block, so a change here ships
# when /srv/hexgate-staging moves to a commit that has it, followed by `sudo
# nginx -t && sudo systemctl reload nginx` (platform/DEPLOY.md sections 3 and
# 6). The server block keeps its own listen, TLS, headers and catch-all
# `location /` to the api on 127.0.0.1:7200.
#
# hexgate-prod.conf is this file with the prod ports and zone names;
# `make nginx-check` fails if the two drift apart.

# The collector's OTLP/HTTP receiver (HEXGATE_OTLP_PORT), so the SDK's default
# endpoint <api url>/v1/traces works with no client config. The body cap is
# the proxy's own and is checked before the collector verifies the token, so
# it is what an unauthenticated caller can make nginx buffer: 32m covers a
# 64-span batch of maximally sized message spans and nothing more
# (docs/internals/audit-pipeline.md, record-size budget). The timeouts are
# the ones the box's hand-written block set, kept so the move changes nothing.
location = /v1/traces {
    proxy_pass http://127.0.0.1:7201;
    client_max_body_size 32m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

# The MCP and OAuth paths answer callers with no credentials, by design
# (discovery, the login redirect and the token exchange come before any
# token), and /v1/oauth/authorize and /token make the api fetch a client
# metadata document from whatever host the caller names. So each is limited
# per client IP, with the zones in hexgate-zones-staging.conf. A login is
# about eight requests across them; a caller over the limit gets 429, here
# rather than at http level, where it would change the box's other sites.
# Every location below is `=` or `^~`: either one stops nginx trying the
# server's regex locations, so a `location ~ /\.` deny there cannot refuse them.
limit_req_status 429;

# The MCP server (HEXGATE_MCP_PORT). A prefix, not `= /mcp`: the server
# redirects /mcp/ to /mcp, built from the Host header the server block
# forwards. Replies may stream as server-sent events, hence no buffering.
location ^~ /mcp {
    limit_req zone=hexgate_mcp_staging burst=40 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:7202;
    proxy_buffering off;
}

# The MCP server's protected-resource metadata, the first document a client
# reads after the 401 from /mcp; it names the api as the authorization server.
location = /.well-known/oauth-protected-resource/mcp {
    limit_req zone=hexgate_oauth_staging burst=20 nodelay;
    proxy_pass http://127.0.0.1:7202;
}

# The api's two discovery documents. Exact matches, so any other
# /.well-known/ handling the server has (ACME, security.txt) keeps working.
location = /.well-known/oauth-authorization-server {
    limit_req zone=hexgate_oauth_staging burst=20 nodelay;
    proxy_pass http://127.0.0.1:7200;
}
location = /.well-known/jwks.json {
    limit_req zone=hexgate_oauth_staging burst=20 nodelay;
    proxy_pass http://127.0.0.1:7200;
}

# The api's OAuth endpoints, the consent page's two calls and the dashboard's
# grant list and revoke included. 1m holds them to what they carry (a token
# form, the consent JSON).
location ^~ /v1/oauth/ {
    limit_req zone=hexgate_oauth_staging burst=20 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:7200;
}
