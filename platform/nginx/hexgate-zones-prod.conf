# Rate-limit zones for prod's routes (hexgate-prod.conf), at http level:
# the box's /etc/nginx/conf.d/ includes this file from /srv/hexgate-prod by
# wildcard (platform/DEPLOY.md section 3). Per stage, so a zone always arrives
# and leaves with the checkout whose limit_req lines name it: one shared file
# would come from a single checkout, and a stage ahead of it would name a zone
# that does not exist, which fails every reload on the box.
#
# The name is not hexgate-prod*.conf on purpose: the server block's
# wildcard would include it, and a zone at server level is an error.
limit_req_zone $binary_remote_addr zone=hexgate_oauth_prod:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=hexgate_mcp_prod:10m rate=20r/s;
