version: 1

roles:
  read_only:
    is_mixin: true
    tools:
      web_search: { mode: allow }
      view_orders: { mode: allow }

  default:
    inherits: [read_only]

  support:
    inherits: [read_only]
    tools:
      send_email: { mode: allow }
      read_file:
        mode: allow
        constraints:
          - startswith(args.file_path, "src/") or startswith(args.file_path, "docs/")
          - not matches(args.file_path, "(^|/)\\.env$")

  billing:
    inherits: [read_only]
    tools:
      refund_order:
        mode: allow
        constraints:
          - args.amount <= 500
          - args.currency in ["USD", "EUR"]
