# Inspect's sandbox for `agent=claude` (task.py checks IS_SANDBOX). The token comes from the host's env; never an ANTHROPIC_* key, it would take precedence.
services:
  default:
    build:
      context: ../..
      dockerfile: evals/policy_writing/Dockerfile
    image: hexgate-policy-eval
    command: ["tail", "-f", "/dev/null"]
    init: true
    stop_grace_period: 1s
    working_dir: /workspace
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN
      - IS_SANDBOX=1
