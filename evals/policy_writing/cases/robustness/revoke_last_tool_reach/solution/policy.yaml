version: 1

roles:
  default:
    tools:
      view_orders: { mode: allow }

  support:
    tools:
      view_orders: { mode: allow }
      send_email: { mode: allow }

  billing:
    tools:
      view_orders: { mode: allow }
      refund_order:
        mode: allow
        constraints:
          - args.amount <= 1000
    agents:
      refund-bot: { via: [tool], mode: deny }   # explicit, so the reach gates stay on
