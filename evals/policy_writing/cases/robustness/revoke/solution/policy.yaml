# Starting point for the single-file cases: a customer-support agent with a
# shared read-only base and three selectable roles.
version: 1

roles:
  read_only:
    is_mixin: true
    tools:
      web_search: { mode: allow }
      view_orders: { mode: allow }

  default:
    inherits: [read_only]

  support:
    inherits: [read_only]

  billing:
    inherits: [read_only]
    tools:
      refund_order:
        mode: allow
        constraints:
          - args.amount <= 500
          - args.currency in ["USD", "EUR"]
