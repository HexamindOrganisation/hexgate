# Org defaults every role inherits: read access, the egress allowlist and
# admission to this agent. Plus a run cap for everyone.
version: 1

constraints:
  - run.tool_calls < 50

roles:
  org_defaults:
    is_mixin: true
    admission: { mode: allow }
    tools:
      view_orders: { mode: allow }
      net.http_request:
        mode: allow
        constraints:
          - args.host in ["api.acme.com"]
          - args.scheme == "https"

  default:
    inherits: [org_defaults]

  support:
    inherits: [org_defaults]
    tools:
      send_email: { mode: allow }
      refund_order:
        mode: allow
        constraints:
          - args.amount <= 50

  auditor:
    inherits: [org_defaults]
    tools:
      lookup_order: { mode: allow }
