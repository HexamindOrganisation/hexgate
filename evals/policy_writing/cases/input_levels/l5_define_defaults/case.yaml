starting_project: support_bot_single_file
agent: support-bot
request: Set defaults for this agent. Any tool not explicitly listed is denied, every run stops after 50 tool calls, and roles we don't know may only read (search the web and view orders).
expect:
  decisions:
    - { role: default, tool: web_search, args: { query: q }, expect: allow }
    - { role: default, tool: view_orders, args: { customer_id: c1 }, expect: allow }
    - { role: default, tool: refund_order, args: { order_id: o1, amount: 10, currency: USD }, expect: deny }
    - { role: default, tool: send_email, args: { to: [a@acme.com], subject: s, body: b }, expect: deny }
    - { roles: [default, support, billing], tool: read_file, args: { file_path: src/a.py }, expect: deny }
    - { role: billing, tool: refund_order, args: { order_id: o1, amount: 100, currency: USD }, run_facts: { tool_calls: 49 }, expect: allow }
    - { role: billing, tool: refund_order, args: { order_id: o1, amount: 100, currency: USD }, run_facts: { tool_calls: 50 }, expect: deny }
    - { role: default, tool: web_search, args: { query: q }, run_facts: { tool_calls: 50 }, expect: deny }
    - { role: support, tool: send_email, args: { to: [a@acme.com], subject: s, body: b }, run_facts: { tool_calls: 50 }, expect: deny }
