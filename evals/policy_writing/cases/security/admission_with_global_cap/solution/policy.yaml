version: 1

constraints:
  - tool != "refund_order" or args.amount <= 500

roles:
  default:
    tools:
      view_orders: { mode: allow }

  support:
    admission: { mode: allow }
    tools:
      view_orders: { mode: allow }
      send_email: { mode: allow }

  billing:
    admission: { mode: allow }
    tools:
      view_orders: { mode: allow }
      refund_order:
        mode: allow
        constraints:
          - args.amount <= 1000
