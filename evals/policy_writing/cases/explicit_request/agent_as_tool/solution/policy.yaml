version: 1

roles:
  default:
    tools:
      view_orders: { mode: allow }
    agents:
      billing-bot: { via: [handoff], mode: allow }

  support:
    tools:
      view_orders: { mode: allow }
      send_email: { mode: allow }
    agents:
      billing-bot: { via: [handoff], mode: allow }
      admin-bot: { mode: deny }

  billing:
    tools:
      view_orders: { mode: allow }
      refund_order:
        mode: allow
        constraints:
          - args.amount <= 1000
    agents:
      refund-bot: { via: [tool], mode: allow }
      billing-bot: { via: [handoff], mode: allow }
      admin-bot: { mode: deny }
