    - { role: billing, tool: refund_order, args: { order_id: o1, amount: 100, currency: GBP }, attributes: { department: finance }, expect: deny }
    - { role: billing, tool: refund_order, args: { order_id: o1, amount: 400, currency: EUR }, attributes: { department: finance }, expect: allow }
    - { role: support, tool: refund_order, args: { order_id: o1, amount: 100, currency: USD }, attributes: { department: finance }, expect: deny }
