version: 1

roles:
  default:
    tools:
      view_orders: { mode: allow }

  support:
    tools:
      view_orders: { mode: allow }
      send_email: { mode: allow }
    agents:
      billing-bot: { via: [handoff], mode: approval_required }

  billing:
    tools:
      view_orders: { mode: allow }
      refund_order:
        mode: allow
        constraints:
          - args.amount <= 1000
