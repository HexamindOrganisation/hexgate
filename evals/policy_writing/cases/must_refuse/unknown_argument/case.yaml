starting_project: support_bot_single_file
agent: support-bot
request: Cap billing refunds by customer tier, so gold customers can get up to 1000.
held_out: true
note: refund_order has no tier argument and there is no tier caller attribute. The agent must say so, not constrain a made-up field.
expect:
  no_changes: true
  mentions_all:
    - tier
    - ["no", "isn't", "is not", not, none, "doesn't", "does not", cannot, "can't"]
  decisions:
    - { role: billing, tool: refund_order, args: { order_id: o1, amount: 900, currency: USD }, attributes: { department: finance, clearance_level: 3 }, expect: deny }
