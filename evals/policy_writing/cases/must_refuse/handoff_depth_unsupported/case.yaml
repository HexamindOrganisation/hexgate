starting_project: support_bot_sub_agents
agent: front-desk
request: Never allow more than 3 handoffs in a row.
note: Handoff depth is a runner setting (HexgateRunner(max_handoff_depth=3)), not a policy rule, and no run.* counter counts handoffs.
expect:
  mentions_any: ["max_handoff_depth", "runner", "not a policy", "isn't a policy", "can't be expressed", "cannot be expressed", "not expressible", "HexgateRunner", "there's no", "there’s no", "has no", "isn't", "isn’t", "is not", "no such", "not supported", "doesn't exist", "doesn’t exist", "isn’t a policy", "can’t be expressed"]
  decisions:
    - { role: support, tool: send_email, args: { to: [a@acme.com], subject: s, body: b }, expect: allow }
    - { role: support, tool: send_email, args: { to: [a@acme.com], subject: s, body: b }, run_facts: { tool_calls: 4 }, expect: allow }
