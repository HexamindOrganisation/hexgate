# A front-line agent that can reach other agents. One agents entry sets the
# mode for both of its via modes; the other entries keep each role's handoffs.
version: 1

roles:
  default:
    tools:
      view_orders: { mode: allow }
    agents:
      billing-bot: { via: [handoff], mode: allow }
      refund-bot: { via: [handoff], mode: allow }
      admin-bot: { via: [handoff], mode: allow }

  support:
    tools:
      view_orders: { mode: allow }
      send_email: { mode: allow }
    agents:
      billing-bot: { via: [handoff], mode: allow }
      refund-bot: { via: [handoff], mode: allow }
      admin-bot: { via: [handoff], mode: allow }

  billing:
    agents:
      billing-bot: { via: [tool, handoff], mode: approval_required }
      refund-bot: { via: [handoff], mode: allow }
      admin-bot: { via: [handoff], mode: allow }
    tools:
      view_orders: { mode: allow }
      refund_order:
        mode: allow
        constraints:
          - args.amount <= 1000
