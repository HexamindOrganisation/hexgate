starting_project: support_bot_sub_agents
agent: front-desk
request: Billing may call billing-bot as a tool freely, but handing the conversation off to billing-bot needs a human approval.
note: In a single-file policy one agents entry has one mode for all its via modes, and a role's entry replaces an inherited one, so this exact rule can't be written. The agent must not allow the handoff outright, and must say it had to compromise.
expect:
  mentions_any: ["one mode", "single mode", "same mode", "both modes", "per mode", "per-mode", "can't give", "cannot give", "can't set", "cannot set", "not possible", "isn't possible", "limitation", "compromise"]
  decisions:
    - { role: billing, tool: "agent.tool:billing-bot", args: {}, expect: [allow, approval_required] }
    - { role: billing, tool: "agent.handoff:billing-bot", args: {}, expect: [approval_required, deny] }
    - { role: support, tool: "agent.tool:billing-bot", args: {}, expect: deny }
    - { role: support, tool: "agent.handoff:billing-bot", args: {}, expect: deny }
