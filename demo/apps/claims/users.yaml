# Fake accounts for the Claimdesk demo app. Edit freely: the app re-reads this
# file at every sign-in.
#
# Passwords are plain text on purpose: this is a local demo, never a real login.
# `roles` is what the copilot passes to hexgate as the caller's roles, and
# `attributes` what it passes as caller attributes (ctx.* in the policy). A role
# the policy doesn't mention gets the policy's `default` access.

users:
