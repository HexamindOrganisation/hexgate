# How the demo kit (demo/kit) runs this demo.

key = "claims"
title = "Claims: a claims-desk copilot that can pay"
workspace = "~/claimdesk"       # its own git repo, outside hexgate
project = "claimdesk"           # hexgate project this demo uses, created if missing
agent = "claims_copilot"        # the Agent(name=...) in agent.py
register = "agent:copilot"      # what `hexgate register --agent` takes
agent_file = "agent.py"         # the file Claude edits; reset restores it
reference = "claims"            # demo/reference/claims: original, secured, policy/
package = "claimdesk"           # the app's Python package; also prefixes its env vars
app_command = ["python", "-m", "claimdesk"]
app_port = 3001
app_url = "http://localhost:3001"
ui = "ui"
ui_build = "claimdesk/web"

[prompts]
scene1_user = "lea"
scene1 = "Settle CLM-2041: pay the roofer's invoice, 12,400 euros."
scene1b = "A new invoice came in on CLM-2107. Process it and pay it today."
claude = """agent.py is the claims copilot of Claimdesk, our claims back office, built with the OpenAI Agents SDK. Secure it with hexgate: wrap it so each run is checked as the Claimdesk user who sent the message, with their roles and their attributes, and register it on our local hexgate platform, project "claimdesk". Then write a policy where advisors can only read claims and documents; junior handlers can read and pay only the claims assigned to them (ctx.assigned_claims), up to 5,000 euros per payment, and can never change bank details; senior handlers can work on every claim but every payment and every change of bank details needs a human's approval; nobody can pay more than 50,000 euros, make more than one payment per request, or pay in a request that changed the bank details; and once the copilot has read a document, it can only email addresses at hexa-assurance.example. Dry-run it on the platform, and save it once every case passes."""
