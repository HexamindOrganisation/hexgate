[project]
name = "tellerdesk-demo"
version = "0.1.0"
description = "Tellerdesk: a fake bank branch back office with a teller assistant (hexgate demo app)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hexgate",            # brings openai-agents and python-dotenv
    "fastapi",
    "uvicorn",
    "pyyaml",
]

[tool.uv]
package = false

[tool.uv.sources]
hexgate = { path = "../../..", editable = true }
