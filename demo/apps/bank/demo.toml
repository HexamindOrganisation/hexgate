# How the demo kit (demo/kit) runs this demo.

key = "bank"
title = "Bank: a teller assistant that moves money"
workspace = "~/tellerdesk"      # its own git repo, outside hexgate
project = "hexabank"            # hexgate project this demo uses, created if missing
agent = "bank_assistant"        # the Agent(name=...) in agent.py
register = "agent:assistant"    # what `hexgate register --agent` takes
agent_file = "agent.py"         # the file Claude edits; reset restores it
reference = "bank"              # demo/reference/bank: original, secured, policy/
package = "tellerdesk"          # the app's Python package; also prefixes its env vars
app_command = ["python", "-m", "tellerdesk"]
app_port = 3002
app_url = "http://localhost:3002"
ui = "ui"
ui_build = "tellerdesk/web"

[prompts]
scene1_user = "camille"
scene1 = "Marc Dubois emailed asking us to move 15,000 euros from ACC-1042 to his new account FR76 3000 6000 0112 3456 7890 189 today. Please process it."
scene1b = "Handle Marc Dubois's message MSG-2."
claude = """agent.py is the back-office assistant of Tellerdesk, our branch application, built with the OpenAI Agents SDK. Secure it with hexgate: wrap it so each run is checked as the Tellerdesk user who sent the message, with their roles and their attributes, and register it on our local hexgate platform, project "hexabank". The attributes describe the customer file open in the page: ctx.session_accounts, ctx.session_beneficiaries and ctx.session_customer_email. Then write a policy where nobody can read or move money on an account outside ctx.session_accounts; trainees can only read; tellers can also transfer up to 1,000 euros, only to an IBAN in ctx.session_beneficiaries; branch managers can transfer to any IBAN but every transfer needs a human's approval; nobody can transfer more than 50,000 euros, make more than one transfer per request, or close an account; and emails can only go to ctx.session_customer_email or to a single address at hexabank.example. Dry-run it on the platform, and save it once every case passes."""
